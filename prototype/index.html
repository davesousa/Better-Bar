<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laminar Dock Prototype</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/dock.css">
  <link rel="stylesheet" href="css/launchpad.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <!-- Wallpaper (generated SVG) -->
  <div id="wallpaper" aria-hidden="true"></div>

  <!-- Simulated application windows -->
  <div id="desktop"></div>

  <!-- Launchpad overlay -->
  <div id="launchpad" aria-hidden="true"></div>

  <!-- Bottom-edge reveal zone (used when auto-hide is on) -->
  <div id="reveal-glow" aria-hidden="true"></div>

  <!-- The dock -->
  <div id="dock-wrap">
    <div id="dock" class="glass" role="toolbar" aria-label="Dock"></div>
  </div>

  <!-- Floating chrome -->
  <div id="dock-label" class="glass strong"></div>
  <div id="preview-pop" class="glass strong"></div>
  <div id="stack-pop"></div>
  <div id="menu-layer"></div>
  <div id="toasts"></div>

  <div id="proto-hint" class="glass strong">
    <b>Laminar Dock</b> prototype
    <span class="dot-sep"></span>
    <kbd>Ctrl</kbd>+<kbd>Space</kbd> or <kbd>`</kbd> opens Launchpad <span class="muted">(the Windows key in the real app)</span>
    <button id="proto-hint-close" aria-label="Dismiss">✕</button>
  </div>

  <!-- Refraction filter for the dock: a displacement map bends the wallpaper at the glass edges -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ld-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feImage id="ld-refract-map" x="0" y="0" width="800" height="72" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap id="ld-refract-disp" in="SourceGraphic" in2="map" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <script src="js/state.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/menus.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/windows.js"></script>
  <script src="js/dock.js"></script>
  <script src="js/stacks.js"></script>
  <script src="js/previews.js"></script>
  <script src="js/launchpad.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
