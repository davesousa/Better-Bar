<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Laminar Dock</title>
  <desc id="d">A glassy dock and Launchpad for Windows, built in Rust. Animated dock icons rise in a wave.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0820" flood-opacity="0.45"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="i1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#2f5bff"/></linearGradient>
    <linearGradient id="i2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="i3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0ea5a4"/></linearGradient>
    <linearGradient id="i4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#e2489a"/></linearGradient>
    <linearGradient id="i5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="i6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="i7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="i8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e9e3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <style>
    .blob { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-duration: 17s; animation-delay: -5s; }
    .b3 { animation-duration: 20s; animation-delay: -9s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(90px, -40px) scale(1.15); }
      100% { transform: translate(-70px, 30px) scale(0.92); }
    }
    .ico { transform-box: fill-box; transform-origin: 50% 100%; animation: wave 4.2s cubic-bezier(.45,0,.25,1) infinite; }
    @keyframes wave {
      0%, 18%, 100% { transform: translateY(0) scale(1); }
      8%            { transform: translateY(-8px) scale(1.3); }
    }
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
    text { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .blob, .ico, .dot { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#1b1550"/>
    <g filter="url(#soft)">
      <circle class="blob" cx="230" cy="110" r="230" fill="#4f46e5"/>
      <circle class="blob b2" cx="900" cy="80" r="240" fill="#ec4899" opacity="0.85"/>
      <circle class="blob b3" cx="620" cy="360" r="230" fill="#3b82f6" opacity="0.9"/>
      <circle class="blob b2" cx="1150" cy="360" r="200" fill="#f97366" opacity="0.8"/>
    </g>

    <text x="600" y="118" text-anchor="middle" font-size="76" font-weight="700" fill="url(#title)" letter-spacing="-1.5">Laminar Dock</text>
    <text x="600" y="164" text-anchor="middle" font-size="25" fill="#ffffff" fill-opacity="0.88">A glassy dock and Launchpad for Windows, built in Rust.</text>
    <text x="600" y="204" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff" fill-opacity="0.72" letter-spacing="2.5">0% IDLE CPU  ·  UNDER 30 MB RAM  ·  FREE &amp; OPEN SOURCE  ·  BETA</text>

    <!-- Dock -->
    <g filter="url(#shadow)">
      <rect x="330" y="270" width="540" height="72" rx="22" fill="url(#glass)"/>
      <rect x="330.5" y="270.5" width="539" height="71" rx="21.5" fill="none" stroke="url(#edge)"/>
    </g>
    <!-- Icons: 48px squircles, 12px apart, staggered so the wave travels left to right -->
    <g>
      <g class="ico" style="animation-delay:0s">
        <rect x="350" y="282" width="48" height="48" rx="13" fill="url(#i1)"/>
        <g fill="#fff"><rect x="361" y="293" width="11" height="11" rx="2"/><rect x="376" y="293" width="11" height="11" rx="2"/><rect x="361" y="308" width="11" height="11" rx="2"/><rect x="376" y="308" width="11" height="11" rx="2"/></g>
      </g>
      <g class="ico" style="animation-delay:.22s">
        <rect x="410" y="282" width="48" height="48" rx="13" fill="url(#i2)"/>
        <path d="M421 297h10l3 3h13v16h-26z" fill="#fff" fill-opacity=".92"/>
      </g>
      <g class="ico" style="animation-delay:.44s">
        <rect x="470" y="282" width="48" height="48" rx="13" fill="url(#i3)"/>
        <circle cx="494" cy="306" r="12" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M494 294a12 12 0 0 1 0 24" fill="#fff"/>
      </g>
      <g class="ico" style="animation-delay:.66s">
        <rect x="530" y="282" width="48" height="48" rx="13" fill="url(#i4)"/>
        <path d="M546 296l16 10-16 10z" fill="#fff"/>
      </g>
      <rect x="590" y="288" width="2" height="36" rx="1" fill="#fff" fill-opacity=".35"/>
      <g class="ico" style="animation-delay:.88s">
        <rect x="604" y="282" width="48" height="48" rx="13" fill="url(#i5)"/>
        <path d="M618 296h20M618 304h20M618 312h13" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g class="ico" style="animation-delay:1.10s">
        <rect x="664" y="282" width="48" height="48" rx="13" fill="url(#i6)"/>
        <path d="M676 298l7 6-7 6M688 312h12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="ico" style="animation-delay:1.32s">
        <rect x="724" y="282" width="48" height="48" rx="13" fill="url(#i7)"/>
        <path d="M736 316l8-9 6 5 10-12" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="ico" style="animation-delay:1.54s">
        <rect x="784" y="282" width="48" height="48" rx="13" fill="url(#i8)"/>
        <circle cx="808" cy="306" r="9" fill="#fff"/><path d="M808 291v4M808 317v4M793 306h4M819 306h4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- running / attention dots -->
      <circle cx="434" cy="337" r="2.2" fill="#fff" fill-opacity=".8"/>
      <circle cx="688" cy="337" r="2.2" fill="#fff" fill-opacity=".8"/>
      <circle class="dot" cx="755" cy="337" r="2.6" fill="#4ade80"/>
      <circle cx="748" cy="337" r="2.2" fill="#fff" fill-opacity=".8"/>
    </g>
  </g>
</svg>
